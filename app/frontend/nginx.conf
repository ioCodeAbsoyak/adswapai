worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  keepalive_timeout  65;

  # Uploads go straight to the backend; keep limits generous
  client_max_body_size      512M;
  proxy_request_buffering   off;
  proxy_connect_timeout     60s;
  proxy_send_timeout        900s;
  proxy_read_timeout        900s;

  upstream backend_api {
    server backend:5000;
  }

  # Legacy domain -> main domain
  server {
    listen 80;
    server_name altervision.tv www.altervision.tv;
    return 301 $scheme://adswap.ai$request_uri;
  }

  # Main site (adswap.ai, localhost, any other host)
  server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    location /sampleVideos/ {
      # Range requests for the sample players
      add_header Accept-Ranges bytes;
    }

    # Backend API
    location ~ ^/(process|process-status|all-jobs|jobs|health|videos|processed_videos|sample-videos)(/|$) {
      proxy_pass         http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Connection "";
      proxy_buffering    off;
    }
  }
}
