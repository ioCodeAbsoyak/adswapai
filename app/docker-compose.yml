# AdSwapAI - 2026-09-02 build
#   docker compose up -d --build
#   open http://localhost  (or set FRONTEND_PORT=8088 to use another port)
services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: adswapai-backend:20260902
    restart: unless-stopped
    gpus: all
    environment:
      - PROCESSED_DIR=/workspace/processed_videos
      - SAMPLE_VIDEO_DIR=/workspace/sample_videos
      - MAX_UPLOAD_MB=500
    ports:
      - "5000:5000"
    volumes:
      - ./processed_videos:/workspace/processed_videos
      - ./frontend/static/sampleVideos:/workspace/sample_videos:ro
      - ./frontend/static/images:/workspace/ad_images:ro   # ad images for cli.py
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: adswapai-frontend:20260902
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
