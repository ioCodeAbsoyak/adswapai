# AdSwapAI R&D, 2025-06-05: nginx config for the final May 2025 frontend (site routing + API proxy)
worker_processes 1;
events { worker_connections 1024; }

http {
  client_max_body_size 200M;

  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  proxy_connect_timeout 300s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # 1. ALTERVISION.TV: redirect to adswap.ai with a 301!
  server {
    listen 80;
    server_name altervision.tv www.altervision.tv;
    return 301 $scheme://adswap.ai$request_uri;
  }

  # 2. ADSWAP.AI: the main site
  server {
    listen 80;
    server_name adswap.ai www.adswap.ai;

    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ =404;
    }

    location /images/ {
      alias /usr/share/nginx/html/images/;
      autoindex off;
    }

    location /sampleVideos/ {
      alias /usr/share/nginx/html/sampleVideos/;
      autoindex off;
    }

    location /process {
      proxy_pass         http://backend:5000/process;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection "";
    }

    location /videos {
      proxy_pass         http://backend:5000/videos;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }

  # 3. LOCALHOST/127.0.0.1: local development (NO redirect)
  server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ =404;
    }

    location /images/ {
      alias /usr/share/nginx/html/images/;
      autoindex off;
    }

    location /sampleVideos/ {
      alias /usr/share/nginx/html/sampleVideos/;
      autoindex off;
    }

    location /process {
      proxy_pass         http://backend:5000/process;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection "";
    }

    location /videos {
      proxy_pass         http://backend:5000/videos;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
